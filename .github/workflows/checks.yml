name: Checks

# Runs the repository's own checks (every runnable command in CLAUDE.md: self-tests and example validations) on
# every pull request and on main. tools/run_checks.py lists what it skipped, and why, in each job's summary.
#
# Third-party actions are pinned to full commit SHAs (the release tag is in the comment beside each).

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared files and the check runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Shared copies match shared/
        run: python tools/check_shared.py

      - name: Unregistered-copy detector self-test
        run: python tools/check_shared.py --self-test

      - name: Check runner self-test
        run: python tools/run_checks.py --self-test

  checks:
    name: Self-tests and examples (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/requirements.txt

      # Node 22 LTS, pinned, so the node:test and JUnit paths are checked on it (not on whichever Node the image ships)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # pytest is the only package the non-browser checks need (the examples' sample packages are tested with it);
      # go and cargo come with the runner image
      - name: Install pytest
        run: pip install -r benchmarks/requirements.txt

      - name: Toolchains
        run: |
          python --version
          node --version
          go version || echo "go: not installed"
          cargo --version || echo "cargo: not installed"

      # the pinned engines, assets and lists some checks verify (each fetcher checks their hashes; not committed)
      - name: Cache the pinned downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/qa-skills
          key: qa-skills-downloads-${{ hashFiles('*-skill/data/*.lock.json') }}

      - name: Fetch the pinned downloads
        run: |
          python wcag-auditor-skill/scripts/fetch_engines.py
          python performance-budget-auditor-skill/scripts/fetch_assets.py
          python cross-browser-checker-skill/scripts/fetch_data.py
          python privacy-flow-auditor-skill/scripts/fetch_lists.py

      - name: Run the checks
        run: >-
          python tools/run_checks.py --shard ${{ matrix.shard }}/4 --skip-browser --require node,pytest,downloads
          --json "$RUNNER_TEMP/checks-${{ matrix.shard }}.json"

  browser:
    name: Browser self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "*-skill/requirements.txt"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # the skills' requirements.txt pin playwright>=1.49,<2
      - name: Install Playwright and Chromium
        run: |
          pip install -r wcag-auditor-skill/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cache the pinned downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/qa-skills
          key: qa-skills-downloads-${{ hashFiles('*-skill/data/*.lock.json') }}

      - name: Fetch the pinned downloads
        run: |
          python wcag-auditor-skill/scripts/fetch_engines.py
          python performance-budget-auditor-skill/scripts/fetch_assets.py
          python cross-browser-checker-skill/scripts/fetch_data.py
          python privacy-flow-auditor-skill/scripts/fetch_lists.py

      - name: Run the browser checks
        run: >-
          python tools/run_checks.py --browser-only --require browser,node
          --json "$RUNNER_TEMP/checks-browser.json"
