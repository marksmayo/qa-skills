[package]
name = "tidemark"
version = "0.3.0"
edition = "2021"
description = "Synthetic fixture: a tide-table CLI that predicts heights for a coastal station and plots them"
publish = false

[[bin]]
name = "tidemark"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
libloading = "0.8"
chrono = "=0.4.19"
ansi_term = "0.12"
