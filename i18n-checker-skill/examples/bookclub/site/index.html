<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookclub (sample)</title><link rel="stylesheet" href="css/site.css"></head>
<body>
<header>
  <nav class="tabs"><a href="index.html" data-i18n="nav.home">Home</a><a href="events.html" data-i18n="nav.events">Events</a><a href="#" data-i18n="nav.books">Books</a><a href="#" data-i18n="nav.about">About</a></nav>
  <button class="signin" type="button">Sign in</button>
</header>
<main>
  <h1 id="greeting">Hello, Robin!</h1>
  <p data-i18n="welcome" data-i18n-args='{"name": "Robin"}'>Welcome back, Robin!</p>
  <p data-i18n="books.count" data-i18n-args='{"count": 3}'>You have 3 books on your shelf</p>
  <p id="price">Membership: $12.50 a year</p>
  <p class="cta"><a href="events.html" data-i18n="events.rsvp">Reserve a seat</a><span class="icon">&rarr;</span></p>
</main>
<footer><span data-i18n="footer.newsletter">Newsletter</span> &middot; <span data-i18n="footer.contact">Contact us</span></footer>
<script src="js/i18n.js"></script><script src="js/app.js"></script>
</body></html>
